name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: sudo apt-get update && sudo apt-get install -y softhsm2 ripgrep
      - run: make local-check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-acceptance
          path: |
            .local/verification-latest.json
            .local/acceptance/**/report.json
            .local/acceptance/**/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  extension-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@7.33.7
      - working-directory: apps/extension
        run: pnpm install --frozen-lockfile
      - working-directory: apps/extension
        run: pnpm run build:prd:chrome
